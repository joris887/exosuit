name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hook-tests:
    name: Hook tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run hook test suite
        run: bash .claude/hooks/tests/run-all.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck -S error .claude/hooks/*.sh install.sh

  flow-contracts:
    name: Flow contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate flow contracts
        run: bash .claude/skills/doctor/scripts/validate-flows.sh
      - name: Generated flow views are current
        run: bash .claude/skills/doctor/scripts/render-flow.sh --check
