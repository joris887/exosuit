name: Feature Request
description: Suggest a new skill, rule, hook, or framework improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: What problem are you trying to solve? What workflow would benefit?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current Workaround
      description: How do you handle this today without the feature?
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: Proposed Type
      description: What kind of addition would address this?
      options:
        - New Skill
        - New Rule
        - New Hook
        - Skill Enhancement
        - Framework Core
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the feature. For skills, include trigger conditions and expected output.
    validations:
      required: true

  - type: dropdown
    id: compatibility
    attributes:
      label: Backward Compatibility
      description: Would this change break existing workflows?
      options:
        - Fully backward compatible (additive only)
        - Minor changes to existing behavior
        - Breaking change (requires migration)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, mockups, or examples
    validations:
      required: false
