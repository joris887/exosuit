# Stop hook quality rules: validate completion evidence
# Checks the last assistant message for unverified completion claims.

# Regex to detect completion claims
completion_regex: '\b(complete|done|finished|implemented|delivered|ready for review)\b'

# Regex to detect actual test evidence
# Note: \d+ passed added to catch common test output format (e.g., "3 passed")
evidence_regex: '(\d+ tests?.*pass|PASS\b|Tests:\s+\d+|test result:.*ok|pytest.*passed|All \d+ tests passed|\d+ passed)'

# Note: weak_claims detection was removed. It caused false positives on
# discussion text that merely mentioned phrases like "should work" or
# "looks correct" — e.g., when discussing WHY weak claims are problematic.
# The completion-evidence check above already handles the real concern:
# if you claim "done", you must show test output.
