# PreToolUse safety rules: block dangerous Bash commands
# Each pattern is checked against the command string via regex.
# Matched commands are blocked (exit 2) with the given message.

patterns:
  - id: git-push-force
    regex: 'git\s+push\s+.*--force(\s|$)'
    message: "git push --force is not allowed. Use --force-with-lease if necessary."
  - id: git-push-f
    regex: 'git\s+push\s+.*-f(\s|$)'
    message: "git push -f is not allowed. Use --force-with-lease if necessary."
  - id: git-checkout-dot
    regex: 'git\s+checkout\s+\.\s*$'
    message: "git checkout . discards all changes. Use git stash or commit first."
  - id: git-reset-hard
    regex: 'git\s+reset\s+--hard'
    message: "git reset --hard is destructive. Stash or commit changes first."
  - id: git-clean-f
    regex: 'git\s+clean\s+-f'
    message: "git clean -f permanently deletes untracked files. Review with git clean -n first."
  - id: rm-rf-dangerous
    regex: 'rm\s+-rf\s+(/|\.\.|~)'
    message: "rm -rf on root, parent, or home directory is not allowed."
  - id: package-publish
    regex: '(npm\s+publish|cargo\s+publish|twine\s+upload|gem\s+push|pod\s+trunk\s+push)'
    message: "Package publishing requires manual execution outside Claude Code."
  - id: db-destructive
    regex: '(?i)(DROP\s+(TABLE|DATABASE)|TRUNCATE\s+TABLE)'
    message: "Destructive database operations. Run manually with review."
  - id: mass-kill
    regex: '(kill\s+-9\s+-1|killall\s|pkill\s+-9)'
    message: "Mass process killing is not allowed."
