# Stop hook quality rules: validate completion evidence
# Format: key=value (simple config)
# Lines starting with # are comments. Empty lines are skipped.

# Regex to detect completion claims (case-insensitive grep -Ei)
completion_regex=\b(complete|done|finished|implemented|delivered|ready for review)\b

# Regex to detect actual test evidence (case-insensitive grep -Ei)
evidence_regex=(\d+ tests?.*pass|PASS\b|Tests:\s+\d+|test result:.*ok|pytest.*passed|All \d+ tests passed|\d+ passed)

# Maximum times the Stop hook will block before allowing exit unconditionally
max_iterations=5
