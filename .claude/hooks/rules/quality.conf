# Stop hook quality rules: validate completion evidence
# Format: key=value (simple config)
# Lines starting with # are comments. Empty lines are skipped.

# Regex to detect completion claims (case-insensitive grep -Ei)
#
# Must require a SUBJECT ("implementation is complete"), never a bare adjective.
# The old pattern was (complete|done|finished|implemented|delivered|ready for review),
# which matched ordinary prose — "scan complete", "discovery complete", "done reading" —
# and fired on nearly every summary the model wrote.
completion_regex=((implementation|task|story|feature|fix|refactor|migration)[[:space:]]+(is[[:space:]]+)?(complete|done|finished)|ready[[:space:]]+(for[[:space:]]+review|to[[:space:]]+(merge|ship))|(finished|completed|done)[[:space:]]+implementing|all[[:space:]]+acceptance[[:space:]]+criteria[[:space:]]+(are[[:space:]]+)?met|implemented[[:space:]]+and[[:space:]]+(tested|verified))

# Regex to detect actual test evidence (case-insensitive grep -Ei)
evidence_regex=([0-9]+ tests?.*pass|PASS\b|Tests:[[:space:]]+[0-9]+|test result:.*ok|pytest.*passed|All [0-9]+ tests passed|[0-9]+ passed)

# Maximum times the Stop hook will block before allowing exit unconditionally.
# Override per-session: EXOSUIT_STOP_MAX_ITERATIONS env var.
# Strict project profile defaults to 10 (via hook-guard.sh profile detection).
max_iterations=3

# File extensions counted as SOURCE for the stop hook.
# Both the debug audit and the evidence check are skipped entirely when a
# session changed no files matching this list — a docs, config, or planning
# session has nothing to audit and no tests to run.
source_extensions=go|ts|tsx|js|jsx|mjs|cjs|py|rb|rs|java|kt|kts|cs|php|swift|c|h|cc|cpp|hpp|m|scala|ex|exs|dart|vue|svelte
