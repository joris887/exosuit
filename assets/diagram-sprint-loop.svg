<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="The sprint loop: /sprint-start creates a clean branch off main with a green test baseline. /story-cycle plans, gets your approval, builds test-first and verifies, repeating once per story. /sprint-end runs quality gates, opens the PR and squash merges to main, then the loop starts again.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38342B"/>
    </marker>
  </defs>
  <rect width="1280" height="400" fill="#F1ECE1"/>

  <!-- /sprint-start -->
  <rect x="70" y="100" width="320" height="140" rx="14" fill="#FBF8F1" stroke="#38342B" stroke-width="2"/>
  <text x="230" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#C55B27">/sprint-start</text>
  <text x="230" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#38342B">clean branch off main</text>
  <text x="230" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#38342B">green test baseline</text>

  <line x1="390" y1="170" x2="470" y2="170" stroke="#38342B" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- /story-cycle -->
  <rect x="480" y="100" width="320" height="140" rx="14" fill="#FBF8F1" stroke="#38342B" stroke-width="2"/>
  <text x="640" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#C55B27">/story-cycle</text>
  <text x="640" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#38342B">plan, approve the plan,</text>
  <text x="640" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#38342B">build test-first, verify</text>

  <!-- self loop: one story at a time -->
  <path d="M600,100 C600,42 680,42 680,100" fill="none" stroke="#38342B" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="640" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8A8578">next story</text>

  <line x1="800" y1="170" x2="880" y2="170" stroke="#38342B" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- /sprint-end -->
  <rect x="890" y="100" width="320" height="140" rx="14" fill="#FBF8F1" stroke="#38342B" stroke-width="2"/>
  <text x="1050" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#C55B27">/sprint-end</text>
  <text x="1050" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#38342B">quality gates, PR,</text>
  <text x="1050" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#38342B">squash merge to main</text>

  <!-- loop back -->
  <path d="M1050,240 V320 H230 V250" fill="none" stroke="#38342B" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="640" y="308" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8A8578">merged to main · next sprint</text>
</svg>
