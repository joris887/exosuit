  <text x="94" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#38342B">CLAUDE.md · progress.md · project knowledge base · session handoffs</text>
